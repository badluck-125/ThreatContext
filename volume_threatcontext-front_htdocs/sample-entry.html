<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThreatContext — Sample entry</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <h1>ThreatContext</h1>
            <p class="tagline">CVE &rarr; IoC pipeline</p>
            <nav class="main-nav">
                <a href="/">Home</a>
                <a href="/cve-entry.html">Enter CVE</a>
                <a href="/exploit-entry.html">Enter Exploit</a>
                <a href="/sample-entry.html">Enter Sample</a>
                <a href="/ioc-entry.html">Enter IoC</a>
                <a href="/cve-consult.html">Consult CVE</a>
                <a href="/exploit-consult.html">Consult Exploit</a>
                <a href="/sample-consult.html">Consult Sample</a>
                <a href="/ioc-consult.html">Consult IoC</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <h2>Sample entry</h2>
        <p class="page-info">Register a log sample in the ThreatContext database.</p>
        <form class="api-form" data-entry-endpoint="sample-entry">
            <label for="platform">platform</label>
            <input type="text" id="platform" name="platform" placeholder="linux_x86-64, php" required>
            <label for="title">title</label>
            <input type="text" id="title" name="title" placeholder="Local user switching, http GET" required>
            <label for="point_of_interest">point_of_interest (JSON)</label>
            <input type="text" id="point_of_interest" name="point_of_interest" placeholder="{"poi": ["source_ip", "url", "method"]}" required>
            <label for="sample_content">sample_content</label>
            <textarea id="sample_content" name="sample_content" rows="8" placeholder="2026-10-29 22:22:59.740 UTC [1] LOG:  received fast shutdown request" required></textarea>

            <button type="submit">Send</button>
        </form>
        <div id="status-message" class="status-message" aria-live="polite"></div>
        <div id="result" class="result"></div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <a href="https://github.com/badluck-125/ThreatContext">GitHub</a>
        </div>
    </footer>

    <script src="/threatcontext.js"></script>
</body>
</html>
