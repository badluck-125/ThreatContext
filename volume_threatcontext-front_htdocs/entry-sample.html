<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThreatContext-sample</title>

</head>
<header>
    <div class="container">
        <h1>ThreatContext</h1>
        <h2 class="content">Sample entry</h2>
        <p class="content">Input sample log in ThreatContext</p>
    </div>
    <nav >
        <a class="content" href="/entry-cve.html"> CVE </a> |
        <a class="content" href="/entry-exploit.html"> Exploit </a> |
        <a class="content" href="/entry-ioc.html"> IoC </a> |
        <a class="content" href="/entry-sample.html"> Sample </a>
    </nav>
</header>

<body>
    <div class="container">
        <form class="contact-form">
            <label class="content" for="platform">Platform</label>
            <input type="text" id="platform" name="platform" placeholder="linux_x86-64, php" required>

            <label class="content" for="title">Title</label>
            <input type="text" id="title" name="title" placeholder="Local user switching, http GET" required>

            <label class="content" for="point_of_interest">Point of interest</label>
            <input type="text" id="point_of_interest" name="point_of_interest" placeholder='{"poi": ["source_ip","url","method"] }' required>

            <label class="content" for="sample_content">Sample content</label>
            <textarea id="sample_content" name="sample_content" rows="5" placeholder="2026-10-29 22:22:59.740 UTC [1] LOG:  received fast shutdown request
" required></textarea>

            <button type="submit">Send</button>
        </form>
    </div>
</body>
