; /usr/local/etc/php/conf.d/threatcontext-logging.ini
log_errors = On
error_log = /var/www/logs/php_errors.log
error_reporting = E_ALL
display_errors = Off          ; never show errors to the browser in prod
display_startup_errors = Off
log_errors_max_len = 0        ; don't truncate long messages
memory_limit = -1             ; optional, helps debug big payloads
