<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker-httpd</title>
    <style>
        /* Mistral-inspired color palette */
        :root {
            --primary-color: #6366f1; /* Indigo-600 */
            --secondary-color: #8b5cf6; /* Violet-500 */
            --background-color: #f8fafc; /* Slate-50 */
            --text-color: #1e293b; /* Slate-800 */
            --subtitle-color: #64748b; /* Slate-500 */
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 800px;
            padding: 2rem;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            color: var(--primary-color);
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 500;
            margin-bottom: 2rem;
            color: var(--subtitle-color);
        }

        p {
            font-size: 1.125rem;
            line-height: 1.75;
            margin-bottom: 1.5rem;
        }

        /* Optional: Add a subtle gradient background */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(139, 92, 246, 0.1) 100%);
            z-index: -1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Docker-httpd</h1>
        <h2>Website hosted in Docker environment</h2>
        <p>This website runs using the Apache2 official image.</p>
    </div>
</body>
</html>
